<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrô SP — Planejador de Viagem</title>
<style>
  :root {
    --azul: #0B4EA2;
    --verde: #007E5E;
    --vermelha: #EE1C25;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
    --border: #ddd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;
      --card: #1f2228;
      --text: #eee;
      --muted: #aaa;
      --border: #3a3d44;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d;
    --card: #1f2228;
    --text: #eee;
    --muted: #aaa;
    --border: #3a3d44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  select, input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row > div { flex: 1 1 200px; }
  .estrategias { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .estrategias label {
    display: flex; align-items: center; gap: 6px;
    font-weight: 400; color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 20px; cursor: pointer;
    font-size: 0.85rem;
  }
  .estrategias input { margin: 0; }
  button {
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .fechadas-box {
    display: flex; flex-wrap: wrap; gap: 6px;
    max-height: 110px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    background: var(--bg);
  }
  .chip {
    font-size: 0.78rem;
    padding: 3px 9px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    background: var(--card);
  }
  .chip.on {
    background: #b91c1c;
    color: #fff;
    border-color: #b91c1c;
    text-decoration: line-through;
  }
  #resultado { white-space: pre-wrap; font-size: 0.92rem; line-height: 1.5; }
  .linha-bloco { margin: 14px 0; }
  .linha-titulo { font-weight: 700; margin-bottom: 6px; }
  .estacoes { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .est {
    display: inline-block;
    padding: 3px 8px;
    border: 2px solid;
    border-radius: 12px;
    font-size: 0.82rem;
    background: var(--card);
  }
  .traco { font-weight: 700; }
  .legenda { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
  .erro { color: #d33; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚇 Metrô de SP — Planejador de Viagem</h1>
  <div class="sub">Busca (BFS/DFS/Dijkstra) + lógica de linhas cortadas por estação fechada</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="origem">Origem</label>
        <select id="origem"></select>
      </div>
      <div>
        <label for="destino">Destino</label>
        <select id="destino"></select>
      </div>
    </div>

    <label>Estratégia</label>
    <div class="estrategias" id="estrategias"></div>

    <label>Pedido em linguagem natural (opcional)</label>
    <input type="text" id="pedido" placeholder="de Sé até Jabaquara com Paraíso fechada">

    <div style="height:10px"></div>

    <label>Estações fechadas (clique para alternar)</label>
    <div class="fechadas-box" id="fechadas-box"></div>

    <div style="height:14px"></div>
    <button id="btn-planejar">Planejar viagem</button>
    <button id="btn-limpar" class="secondary">Limpar fechadas</button>
  </div>

  <div class="card">
    <div id="resultado">Escolha origem/destino (ou digite um pedido) e clique em "Planejar viagem".</div>
  </div>

  <div class="card">
    <div id="mapa"></div>
  </div>
</div>

<script>
const CORES = { "Linha 1": "#0B4EA2", "Linha 2": "#007E5E", "Linha 3": "#EE1C25" };
const NOMES_LINHA = { "Linha 1": "Linha 1 - Azul", "Linha 2": "Linha 2 - Verde", "Linha 3": "Linha 3 - Vermelha" };

const LINHAS = {
  "Linha 1": ["Tucuruvi","Parada Inglesa","Jardim São Paulo-Ayrton Senna","Santana","Carandiru","Portuguesa-Tietê","Armênia","Tiradentes","Luz","São Bento","Sé","Liberdade","São Joaquim","Vergueiro","Paraíso","Ana Rosa","Vila Mariana","Santa Cruz","Praça da Árvore","Saúde","São Judas","Conceição","Jabaquara"],
  "Linha 2": ["Vila Madalena","Sumaré","Clínicas","Consolação","Trianon-Masp","Brigadeiro","Paraíso","Ana Rosa","Chácara Klabin","Santos-Imigrantes","Alto do Ipiranga","Sacomã","Tamanduateí","Vila Prudente"],
  "Linha 3": ["Palmeiras-Barra Funda","Marechal Deodoro","Santa Cecília","República","Anhangabaú","Sé","Pedro II","Brás","Bresser-Mooca","Belém","Tatuapé","Carrão","Penha","Vila Matilde","Guilhermina-Esperança","Patriarca","Artur Alvim","Corinthians-Itaquera"],
};

const ESTACOES = [...new Set(Object.values(LINHAS).flat())].sort((a, b) => a.localeCompare(b, "pt-BR"));

function construirMapa() {
  const mapa = {};
  for (const [linha, seq] of Object.entries(LINHAS)) {
    for (let i = 0; i < seq.length - 1; i++) {
      const a = seq[i], b = seq[i + 1];
      (mapa[a] ??= []).push([b, linha]);
      (mapa[b] ??= []).push([a, linha]);
    }
  }
  return mapa;
}
const MAPA = construirMapa();

function terminaisDaLinha() {
  const t = new Set();
  for (const seq of Object.values(LINHAS)) {
    t.add(seq[0] + "|" + Object.keys(LINHAS).find(l => LINHAS[l] === seq));
  }
  return t;
}
// terminal check: estação é a primeira ou última de alguma linha à qual pertence
function ehTerminal(est, linha) {
  const seq = LINHAS[linha];
  return seq[0] === est || seq[seq.length - 1] === est;
}

function linhasCortadas(fechadas) {
  const cortadas = new Set();
  for (const est of fechadas) {
    for (const [linha, seq] of Object.entries(LINHAS)) {
      if (seq.includes(est) && !ehTerminal(est, linha)) cortadas.add(linha);
    }
  }
  return [...cortadas];
}

function integracoes(fechadas) {
  const porEstacao = {};
  for (const [linha, seq] of Object.entries(LINHAS)) {
    for (const est of seq) (porEstacao[est] ??= new Set()).add(linha);
  }
  return Object.entries(porEstacao)
    .filter(([est, linhas]) => linhas.size >= 2 && !fechadas.has(est))
    .map(([est]) => est);
}

function vizinhos(estacao, fechadas) {
  return (MAPA[estacao] || []).filter(([v]) => !fechadas.has(v)).sort((a, b) => a[0].localeCompare(b[0], "pt-BR"));
}

function reconstruir(veio, destino) {
  const caminho = [];
  let atual = destino;
  while (atual !== null) {
    const [anterior, linha] = veio.get(atual);
    caminho.push([atual, linha]);
    atual = anterior;
  }
  caminho.reverse();
  return caminho;
}

function bfsRota(origem, destino, fechadas) {
  const visitadas = [];
  if (fechadas.has(origem) || fechadas.has(destino)) return [null, visitadas];
  const veio = new Map([[origem, [null, null]]]);
  const fila = [origem];
  let head = 0;
  while (head < fila.length) {
    const atual = fila[head++];
    visitadas.push(atual);
    if (atual === destino) return [reconstruir(veio, destino), visitadas];
    for (const [viz, linha] of vizinhos(atual, fechadas)) {
      if (!veio.has(viz)) { veio.set(viz, [atual, linha]); fila.push(viz); }
    }
  }
  return [null, visitadas];
}

function dfsRota(origem, destino, fechadas) {
  const visitadas = [];
  if (fechadas.has(origem) || fechadas.has(destino)) return [null, visitadas];
  const veio = new Map([[origem, [null, null]]]);
  const pilha = [origem];
  const vistos = new Set();
  while (pilha.length) {
    const atual = pilha.pop();
    if (vistos.has(atual)) continue;
    vistos.add(atual);
    visitadas.push(atual);
    if (atual === destino) return [reconstruir(veio, destino), visitadas];
    for (const [viz, linha] of [...vizinhos(atual, fechadas)].reverse()) {
      if (!vistos.has(viz)) { veio.set(viz, [atual, linha]); pilha.push(viz); }
    }
  }
  return [null, visitadas];
}

function dijkstra(origem, destino, fechadas, custoTrecho, custoTroca) {
  const visitadas = [];
  if (fechadas.has(origem) || fechadas.has(destino)) return [null, visitadas];
  const key = (e, l) => e + "||" + l;
  const dist = new Map([[key(origem, null), 0]]);
  const veio = new Map([[key(origem, null), null]]);
  const heap = [[0, origem, null]];
  const vistos = new Set();

  while (heap.length) {
    heap.sort((a, b) => a[0] - b[0]);
    const [d, est, linha] = heap.shift();
    const k = key(est, linha);
    if (vistos.has(k)) continue;
    vistos.add(k);
    visitadas.push(est);
    if (est === destino) {
      const caminho = [];
      let no = k;
      while (no !== null) {
        const [e, l] = no.split("||");
        caminho.push([e, l === "null" ? null : l]);
        no = veio.get(no);
      }
      caminho.reverse();
      return [caminho, visitadas];
    }
    for (const [viz, nova] of vizinhos(est, fechadas)) {
      const extra = custoTrecho + (linha && nova !== linha ? custoTroca : 0);
      const kviz = key(viz, nova);
      if (!dist.has(kviz) || dist.get(kviz) > d + extra) {
        dist.set(kviz, d + extra);
        veio.set(kviz, k);
        heap.push([d + extra, viz, nova]);
      }
    }
  }
  return [null, visitadas];
}

function marcarBaldeacoes(caminho) {
  const baldeacoes = [];
  for (let i = 1; i < caminho.length - 1; i++) {
    const linhaChegada = caminho[i][1];
    const linhaSaida = caminho[i + 1][1];
    if (linhaChegada !== linhaSaida) baldeacoes.push([caminho[i][0], linhaChegada, linhaSaida]);
  }
  return baldeacoes;
}

function paradasEntre(caminho, a, b) {
  const nomes = caminho.map(c => c[0]);
  return Math.abs(nomes.indexOf(b) - nomes.indexOf(a));
}

function planejar(origem, destino, fechadasArr, estrategia) {
  const fechadas = new Set(fechadasArr);
  const buscas = {
    bfs: bfsRota, dfs: dfsRota,
    menos_baldeacoes: (o, d, f) => dijkstra(o, d, f, 0, 1),
    mais_rapida: (o, d, f) => dijkstra(o, d, f, 2, 5),
  };
  const [caminho, visitadas] = buscas[estrategia](origem, destino, fechadas);
  const res = {
    origem, destino, fechadas: [...fechadas].sort((a,b)=>a.localeCompare(b,"pt-BR")),
    estrategia, caminho, visitadas,
    paradas: caminho ? caminho.length - 1 : null,
    baldeacoes: caminho ? marcarBaldeacoes(caminho) : [],
    cortadas: linhasCortadas(fechadas),
    integracoes: integracoes(fechadas),
  };
  if (caminho) res.tempoMin = res.paradas * 2 + res.baldeacoes.length * 5;
  return res;
}

function narrar(res) {
  const linhas = [];
  if (res.fechadas.length) linhas.push("⚠️  Fechada(s): " + res.fechadas.join(", "));

  if (!res.caminho) {
    linhas.push(`❌ Sem rota de ${res.origem} para ${res.destino}.`);
    for (const l of res.cortadas) {
      linhas.push(`   Motivo (R7): a ${NOMES_LINHA[l]} está cortada — a estação fechada não é terminal, então parte a linha em dois trechos.`);
    }
    if (!res.cortadas.length) linhas.push("   Motivo: não há integração aberta entre as linhas.");
    linhas.push(`   Estações visitadas na busca: ${res.visitadas.length}`);
    return linhas.join("\n");
  }

  const caminho = res.caminho;
  const trocaEm = new Set(res.baldeacoes.map(b => b[0]));
  let linhaAtual = caminho[1][1];
  const inicio = caminho[0][0];
  linhas.push(`🚇 ${res.origem} → ${res.destino}: ${res.paradas} paradas, ${res.baldeacoes.length} baldeação(ões), ~${res.tempoMin} min.`);
  linhas.push("");

  let trechoIni = inicio;
  for (let i = 1; i < caminho.length; i++) {
    const [est, linha] = caminho[i];
    if (linha !== linhaAtual || i === caminho.length - 1) {
      const fim = linha === linhaAtual ? est : caminho[i - 1][0];
      const n = paradasEntre(caminho, trechoIni, fim);
      linhas.push(`  • Pegue a ${NOMES_LINHA[linhaAtual]} em ${trechoIni} e vá até ${fim} (${n} parada(s)).`);
      if (trocaEm.has(fim)) linhas.push(`    ↳ Baldeação em ${fim}: troque para a ${NOMES_LINHA[linha]}.`);
      trechoIni = fim;
      linhaAtual = linha;
    }
  }
  linhas.push("");
  linhas.push("  Itinerário: " + caminho.map(c => c[0]).join(" → "));
  linhas.push(`  (busca ${res.estrategia.toUpperCase()}, ${res.visitadas.length} estações visitadas)`);
  return linhas.join("\n");
}

function mapaHtml(res) {
  const fechadas = new Set(res ? res.fechadas : []);
  const naRota = new Set(res && res.caminho ? res.caminho.map(c => c[0]) : []);
  const baldeacoes = new Set(res ? res.baldeacoes.map(b => b[0]) : []);
  const integ = new Set(ESTACOES.filter(e => Object.values(LINHAS).filter(seq => seq.includes(e)).length > 1));

  let out = "";
  for (const [linha, seq] of Object.entries(LINHAS)) {
    const cor = CORES[linha];
    out += `<div class="linha-bloco"><div class="linha-titulo" style="color:${cor}">● ${NOMES_LINHA[linha]}</div><div class="estacoes">`;
    seq.forEach((est, i) => {
      if (i) out += `<span class="traco" style="color:${cor}">—</span>`;
      let fundo = "var(--card)", texto = "var(--text)", borda = cor, extra = "";
      if (fechadas.has(est)) { fundo = "#3336"; texto = "#999"; borda = "#999"; extra = "text-decoration:line-through;"; }
      else if (naRota.has(est)) { fundo = cor; texto = "#fff"; extra = "font-weight:700;"; }
      else if (integ.has(est)) { extra = "font-weight:600;"; }
      const anel = baldeacoes.has(est) ? "box-shadow:0 0 0 3px #FFC400;" : "";
      const marca = baldeacoes.has(est) ? " ⇄" : (fechadas.has(est) ? " ⛔" : "");
      out += `<span class="est" style="border-color:${borda};background:${fundo};color:${texto};${extra}${anel}">${est}${marca}</span>`;
    });
    out += `</div></div>`;
  }
  out += `<div class="legenda">⇄ baldeação • ⛔ estação fechada • negrito = estação de integração</div>`;
  return out;
}

// --------------------------------------------------- interpretação de texto
function norm(txt) {
  return txt.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
const INDICE = new Map(ESTACOES.map(e => [norm(e), e]));

function resolverEstacao(nome) {
  const chave = norm(nome);
  if (INDICE.has(chave)) return INDICE.get(chave);
  for (const [k, v] of INDICE) {
    if (k.startsWith(chave) || k.includes(chave)) return v;
  }
  return null;
}

function interpretarPedido(texto) {
  let bruto = texto.trim();
  const fechadas = [];
  const padraoFechada = /\b(?:com|sem|e)\b\s+(?:a\s+)?(?:esta[cç][aã]o\s+)?([A-Za-zÀ-ÿ0-9.'\-]+(?:\s+[A-Za-zÀ-ÿ0-9.'\-]+){0,3}?)\s+(?:fechad[ao]|interditad[ao]|paralisad[ao]|em\s+obras)/gi;
  let m;
  while ((m = padraoFechada.exec(bruto)) !== null) {
    const est = resolverEstacao(m[1]);
    if (est) fechadas.push(est);
  }
  bruto = bruto.replace(padraoFechada, " ");

  let m2 = bruto.match(/\bde\s+(.+?)\s+(?:para|até|ate|rumo\s+a|a)\s+(.+?)\s*$/i);
  if (!m2) m2 = bruto.match(/^\s*(.+?)\s*(?:->|→|,)\s*(.+?)\s*$/);
  if (!m2) return { origem: null, destino: null, fechadas, erro: "não entendi a origem e o destino" };

  const origem = resolverEstacao(m2[1]);
  const destino = resolverEstacao(m2[2]);
  let erro = null;
  if (!origem) erro = `estação de origem desconhecida: "${m2[1].trim()}"`;
  else if (!destino) erro = `estação de destino desconhecida: "${m2[2].trim()}"`;
  return { origem, destino, fechadas: [...new Set(fechadas)], erro };
}

// ---------------------------------------------------------------- UI wiring
const selOrigem = document.getElementById("origem");
const selDestino = document.getElementById("destino");
const fechadasBox = document.getElementById("fechadas-box");
const estrategiasBox = document.getElementById("estrategias");
const resultadoEl = document.getElementById("resultado");
const mapaEl = document.getElementById("mapa");
const pedidoEl = document.getElementById("pedido");

const fechadasAtuais = new Set();

for (const est of ESTACOES) {
  for (const sel of [selOrigem, selDestino]) {
    const opt = document.createElement("option");
    opt.value = est; opt.textContent = est;
    sel.appendChild(opt);
  }
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = est;
  chip.onclick = () => {
    if (fechadasAtuais.has(est)) fechadasAtuais.delete(est); else fechadasAtuais.add(est);
    chip.classList.toggle("on");
  };
  fechadasBox.appendChild(chip);
}
selOrigem.value = "Tucuruvi";
selDestino.value = "Corinthians-Itaquera";

const ESTRATEGIAS = [
  ["bfs", "Menos paradas (BFS)"],
  ["dfs", "Profundidade (DFS)"],
  ["menos_baldeacoes", "Menos baldeações"],
  ["mais_rapida", "Mais rápida (Dijkstra)"],
];
for (const [val, label] of ESTRATEGIAS) {
  const lbl = document.createElement("label");
  lbl.innerHTML = `<input type="radio" name="estrategia" value="${val}" ${val === "bfs" ? "checked" : ""}> ${label}`;
  estrategiasBox.appendChild(lbl);
}

function estrategiaSelecionada() {
  return document.querySelector('input[name="estrategia"]:checked').value;
}

function rodar() {
  let origem = selOrigem.value, destino = selDestino.value;
  let fechadas = [...fechadasAtuais];

  if (pedidoEl.value.trim()) {
    const p = interpretarPedido(pedidoEl.value);
    if (p.erro) {
      resultadoEl.innerHTML = `<span class="erro">❌ ${p.erro}</span>`;
      return;
    }
    origem = p.origem; destino = p.destino;
    selOrigem.value = origem; selDestino.value = destino;
    if (p.fechadas.length) {
      fechadasAtuais.clear();
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      for (const f of p.fechadas) {
        fechadasAtuais.add(f);
        [...fechadasBox.children].find(c => c.textContent.startsWith(f))?.classList.add("on");
      }
      fechadas = p.fechadas;
    }
  }

  const res = planejar(origem, destino, fechadas, estrategiaSelecionada());
  resultadoEl.textContent = narrar(res);
  mapaEl.innerHTML = mapaHtml(res);
}

document.getElementById("btn-planejar").onclick = rodar;
document.getElementById("btn-limpar").onclick = () => {
  fechadasAtuais.clear();
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
};

mapaEl.innerHTML = mapaHtml(null);
</script>
</body>
</html>
